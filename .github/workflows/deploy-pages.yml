name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check content and code quality
        run: |
          pnpm content:check
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build static site and refresh resume PDF
        run: pnpm build:export

      - name: Verify resume PDF matches current content
        run: |
          test -f out/resume/jin-zaiwei-resume.pdf
          node -e '
            const { readFileSync } = require("node:fs");
            const pdf = readFileSync("out/resume/jin-zaiwei-resume.pdf", "latin1");
            const pages = Number(/\/Count\s+(\d+)/.exec(pdf)?.[1] ?? 0);
            if (pages !== 2) {
              console.error(`Resume PDF page count is ${pages}, expected 2.`);
              process.exit(1);
            }
            if (pdf.includes("localhost") || pdf.includes("127.0.0.1")) {
              console.error("Resume PDF leaks a local address.");
              process.exit(1);
            }
            console.log(`Resume PDF OK: ${pages} pages, ${pdf.length} bytes`);
          '

      - name: Verify system Chrome for E2E
        run: google-chrome --version

      - name: Verify static export
        run: pnpm test:e2e:static

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
