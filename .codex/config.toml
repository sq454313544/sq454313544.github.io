[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@3.2.4"]
enabled_tools = ["resolve-library-id", "query-docs"]
startup_timeout_sec = 30
tool_timeout_sec = 60
required = false

# Keep this project's MCP surface limited to documentation lookup.
[mcp_servers.agentmemory]
enabled = false

[mcp_servers.codegraph]
enabled = false

[mcp_servers.mysql]
enabled = false

[mcp_servers.mysql_ac_local]
enabled = false

[mcp_servers.mysql_ac_multi]
enabled = false

[mcp_servers.mysql_fensu_legacy]
enabled = false
